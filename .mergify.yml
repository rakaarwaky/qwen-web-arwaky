# Mergify configuration for rakaarwaky/qwen-web-arwaky
#
# Products used:
#   Merge Queue     — serializes merges on main so CI checks always run on
#                     the final cumulative state before merge.
#   Workflow Automation — auto-merges PRs when CI is green. GitHub's
#                     ruleset (protect-main) is the merge gate: it requires
#                     1 review approval and the required status checks.
#                     Mergify only automates *when* the merge happens, not
#                     *whether* it is allowed.
#
# Validate before pushing:
#   mergify config validate
#   mergify config simulate https://github.com/rakaarwaky/qwen-web-arwaky/pull/<N>
#
# Note: this repo's CI runs per-job check runs (there is no single "verify"
# check), so queue/merge gate on the concrete check-run names produced by
# .github/workflows/ci.yml: the "Tests (pytest) (3.13)" matrix check run
# (the single, latest-supported Python interpreter) and the "Self-Lint
# (lint-arwaky-cli)" job (AD-05 template hygiene).
#
# In-place checks: the protect-main ruleset sets
# strict_required_status_checks_policy: true, which means checks must run
# on the final merge commit. Mergify supports this via in-place checks:
# merge_queue.max_parallel_checks: 1, every queue rule batch_size: 1, and
# merge_conditions identical to queue_conditions (no two-step CI).

# ── Merge Queue ───────────────────────────────────────────────────────────────
# main is the only protected branch; the queue serializes merges through
# speculative check runs so CI failures surface before they reach main.

queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - -draft
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)
    merge_conditions:
      - base=main
      - -draft
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)
    merge_method: squash
    batch_size: 1
    checks_timeout: 45m

merge_queue:
  max_parallel_checks: 1
  queued_label: queued
  dequeued_label: dequeued
  checking_label: queue-checking
  status_comments: outcomes

# ── Pull Request Rules (Workflow Automation) ─────────────────────────────────
# These rules auto-queue and auto-merge PRs on open and update once CI is
# green. GitHub's ruleset (protect-main) is the merge gate: it requires 1
# review approval and the required status checks. Mergify only automates
# *when* the merge happens, not *whether* it is allowed. No label condition:
# the labeler assigns python/cli/core/mcp/tests/fixtures/deployment/
# configuration to most PRs, so a label gate would block auto-merge on
# the majority of PRs.

pull_request_rules:
  # Auto-queue any PR targeting main once CI passes.
  - name: auto-queue-on-ci-green
    description: Queue a PR to main when checks are green
    conditions:
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)
      - -draft
      - base=main
    actions:
      queue:
        name: default

  # Merge only when CI is green. Mergify injects GitHub branch protections
  # automatically, so a required review set there gates this too.
  - name: merge-when-ci-green
    description: Squash-merge a ready PR to main once CI checks pass
    conditions:
      - base=main
      - -draft
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)
    actions:
      merge:
        method: squash
        merge_bot_account: rakaarwaky

# ── Merge Protections ─────────────────────────────────────────────────────────
# Auto-merge only when CI passes.

merge_protections:
  - name: auto-merge-gate
    description: Hold the merge until the checks report success
    if:
      - base=main
      - -draft
    success_conditions:
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)

merge_protections_settings:
  auto_merge_conditions:
    - check-success=Self-Lint (lint-arwaky-cli)
    - base=main

# ── Priority Rules ─────────────────────────────────────────────────────────────

priority_rules:
  - name: urgent-priority
    conditions:
      - label=urgent
    priority: high

  - name: default-priority
    conditions:
      - -label=urgent
    priority: medium
