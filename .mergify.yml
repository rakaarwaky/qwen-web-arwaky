# Mergify configuration for rakaarwaky/qwen-web-arwaky
#
# Products used:
#   Merge Queue     — serializes merges on main so CI checks always run on
#                     the final cumulative state before merge.
#   Workflow Automation — auto-labels PRs so merge protections and queue
#                     rules can branch on label, keeping the human
#                     responsible for deciding *what* gets queued, Mergify
#                     responsible for *whether* it's safe to land.
#
# Validate before pushing:
#   mergify config validate
#   mergify config simulate https://github.com/rakaarwaky/qwen-web-arwaky/pull/<N>
#
# Note: this repo's CI runs per-job check runs (there is no single "verify"
# check), so queue/merge gate on the concrete check-run names produced by
# .github/workflows/ci.yml: the "Tests (pytest) (3.13)" matrix check run
# (the single, latest-supported Python interpreter) and the "Self-Lint
# (lint-arwaky-cli)" job (AD-05 template hygiene).
#
# Label matching: Mergify's condition lists are AND-lists with no built-in
# OR. To match "ci OR documentation", use the `or:` combinator. The previous
# config used "label~=(ci|docs)", which is not valid regex syntax for Mergify
# (labels are matched with `~=^(...)$` for regex, not parenthesized groups)
# and therefore never matched — silently defeating the queue and merge rules
# below. The labeler (.github/labeler.yml) applies `ci` for .github/workflows
# changes and `documentation` for **/*.md changes; it never applies a label
# literally named `docs`. Gating on `label=docs` therefore could never
# match, so the merge protection stayed stuck. This config gates on the
# labels the labeler actually produces.

# ── Merge Queue ───────────────────────────────────────────────────────────────
# main is the only protected branch; the queue serializes merges through
# speculative check runs so CI failures surface before they reach main.

queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - -draft
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)
    merge_conditions:
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)
      - or:
          - label=ci
          - label=documentation
    merge_method: squash
    batch_size: 1
    checks_timeout: 45m

merge_queue:
  queued_label: queued
  dequeued_label: dequeued
  checking_label: queue-checking
  status_comments: outcomes

# ── Pull Request Rules (Workflow Automation) ─────────────────────────────────
# These rules auto-label PRs on open and update; merge_protections then
# gates the merge on the right labels + green checks.

pull_request_rules:
  # Auto-queue low-risk PRs once CI passes.
  - name: auto-queue-ci-and-docs
    description: Queue PRs labelled ci or documentation when the checks are green
    conditions:
      - or:
          - label=ci
          - label=documentation
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)
      - -draft
      - base=main
    actions:
      queue:
        name: default

  # Merge only when CI is green. Mergify injects GitHub branch protections
  # automatically, so a required review set there gates this too.
  - name: merge-when-ci-green
    description: Squash-merge a ready PR to main once CI checks pass
    conditions:
      - base=main
      - -draft
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)
      - or:
          - label=ci
          - label=documentation
    actions:
      merge:
        method: squash
        merge_bot_account: rakaarwaky

# ── Merge Protections ─────────────────────────────────────────────────────────
# Auto-merge only when CI passes.

merge_protections:
  - name: auto-merge-gate
    description: Hold the merge until the checks report success
    if:
      - base=main
      - -draft
    success_conditions:
      - check-success=Tests (pytest) (3.13)
      - check-success=Self-Lint (lint-arwaky-cli)

merge_protections_settings:
  auto_merge_conditions:
    - check-success=Self-Lint (lint-arwaky-cli)
    - base=main

# ── Priority Rules ─────────────────────────────────────────────────────────────

priority_rules:
  - name: urgent-priority
    conditions:
      - label=urgent
    priority: high

  - name: default-priority
    conditions:
      - -label=urgent
    priority: medium
