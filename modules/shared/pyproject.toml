[project]
name = "qwen-web-arwaky-shared"
version = "6.0.0"
description = "qwen-web-arwaky shared taxonomy, contracts, and utilities (domain layer)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typing_extensions>=4.5.0",
]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "src"}
packages = ["."]