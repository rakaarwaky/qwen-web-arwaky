[project]
name = "qwen-web-shared"
version = "5.2.0"
description = "qwen-web shared taxonomy, contracts, and utilities (domain layer)"
requires-python = ">=3.10"
license = {text = "MIT"}
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "src"}
packages = ["."]