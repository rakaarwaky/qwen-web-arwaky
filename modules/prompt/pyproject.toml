[project]
name = "qwen-web-arwaky-prompt"
version = "6.0.0"
description = "qwen-web-arwaky prompt pipeline/orchestration layer"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "qwen-web-arwaky-shared>=6.0.0",
    "typing_extensions>=4.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["."]
