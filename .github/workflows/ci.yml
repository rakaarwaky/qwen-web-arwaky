name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    name: Format (ruff format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install project
        run: uv sync --no-dev

      - name: Install lint deps
        run: uv pip install ruff

      - name: Check formatting
        run: uv run ruff format --check modules/ tests/

  lint:
    name: Lint (ruff check + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install project
        run: uv sync --no-dev

      - name: Install lint deps
        run: uv pip install ruff mypy

      - name: Install runtime deps
        run: uv pip install textual

      - name: Ruff check
        run: uv run ruff check modules/ tests/

      - name: Mypy check
        run: uv run mypy modules/

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install project
        run: uv sync --no-dev

      - name: Build
        run: uv build

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --no-dev

      - name: Install test deps
        run: uv pip install pytest pytest-asyncio pytest-cov pytest-mock

      - name: Install system dependencies (Playwright)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0

      - name: Install Playwright browser
        run: uv run python -m playwright install chromium

      - name: Run tests
        run: uv run python -m pytest tests/ --ignore=tests/test_e2e_pipeline.py -v

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo rakaarwaky/qwen-web \
            --title "CI Auto-Fix: ${{ github.sha }}" \
            --label "auto-fix-ci" \
            --body "CI workflow failed on $(date -u).
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  self-lint:
    name: Self-Lint (lint-arwaky-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lint-arwaky-cli (pre-built binary)
        run: |
          curl -fsSL \
            https://github.com/rakaarwaky/lint-arwaky/releases/latest/download/lint-arwaky-cli \
            -o "$RUNNER_TEMP/lint-arwaky-cli"
          chmod +x "$RUNNER_TEMP/lint-arwaky-cli"
          sudo mv "$RUNNER_TEMP/lint-arwaky-cli" /usr/local/bin/lint-arwaky-cli
          lint-arwaky-cli version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install project
        run: uv sync --no-dev

      - name: Run self-lint (must be 0 violations)
        run: |
          output=$(lint-arwaky-cli scan . 2>&1) || true
          echo "$output" | tail -5
          violations=$(echo "$output" | grep -oP 'Total:\s*\K\d+') || violations="PARSE_FAILURE"
          echo "Violations: ${violations}"
          [ "${violations}" = "0" ]
