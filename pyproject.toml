[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-web-arwaky"
version = "6.5.0"
description = "Production-grade CLI automation and MCP server for chat.qwen.ai"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "playwright>=1.62.0",
    "structlog>=26.1.0",
    "sentry-sdk>=2.66.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "tenacity>=9.1.4",
    "mcp>=2.0.0",
    "typing_extensions>=4.5.0",
    "textual>=0.64.0",
]

[project.scripts]
qwen-web-arwaky = "modules.root_cli_main_entry:main"
qwa = "modules.root_cli_main_entry:main"
qwen-web-mcp = "modules.root_mcp_main_entry:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.setuptools.package-data]
"modules.templates" = ["*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "RUF100", "BLE"]
ignore = [
    "BLE001",   # blind exception - intentional for browser automation safety
    "B008",     # function call in defaults - NewType() calls are identity, safe
    "S110",     # try-except-pass - intentional for cleanup/guard patterns
    "S112",     # try-except-continue - intentional for element scanning loops
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typing.NewType", "typing_extensions.NewType"]

# Per-file ignores for tests/ — intentional patterns (fixtures, mocks, callbacks)
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "ARG001", "ARG002", "ARG005", "B017", "SIM117", "E741", "N814", "E501"]
"modules/core/tests/**" = ["E402", "ARG001", "ARG002", "ARG005", "B017", "SIM117", "E741", "N814", "E501"]
"modules/cli/tests/**" = ["E402", "ARG001", "ARG002", "ARG005", "B017", "SIM117", "E741", "N814", "E501"]
"modules/mcp/tests/**" = ["E402", "ARG001", "ARG002", "ARG005", "B017", "SIM117", "E741", "N814", "E501"]
"modules/shared/tests/**" = ["E402", "ARG001", "ARG002", "ARG005", "B017", "SIM117", "E741", "N814", "E501"]
"benches/**" = ["E402", "ARG001", "ARG002", "ARG005", "B017", "SIM117", "E741", "N814", "E501"]
"modules/core/src/capabilities_file_uploader.py" = ["BLE001"]
"modules/core/src/capabilities_observability_setup.py" = ["E402"]
"modules/core/src/capabilities_prompt_injector.py" = ["BLE001", "E501"]
"modules/core/src/capabilities_send_dispatcher.py" = ["E501"]
"modules/core/src/capabilities_stream_monitor.py" = ["BLE001"]
"modules/core/src/utility_core_dom_helper.py" = ["BLE001"]
"modules/root_mcp_main_entry.py" = ["E501", "ARG001"]
"modules/shared/src/taxonomy_skill_constant.py" = ["E501"]
"modules/shared/src/taxonomy_core_constant.py" = ["E501"]
[tool.mypy]
strict = true
python_version = "3.10"

follow_imports = "silent"
ignore_missing_imports = false

disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["playwright.*", "tenacity.*", "structlog.*", "sentry_sdk.*", "mcp.*", "fastmcp.*", "rich.*", "textual.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_subclassing_any = false
check_untyped_defs = false

# Relax mypy strictness for test files
[[tool.mypy.overrides]]
module = ["tests.*", "modules.*.tests.*", "benches.*", "modules.*.benches.*"]
disable_error_code = ["no-untyped-def", "no-untyped-call", "arg-type", "assignment", "method-assign", "return-value", "index", "misc", "attr-defined", "no-any-return", "unreachable", "var-annotated", "type-arg", "union-attr", "duplicate-module"]

[tool.bandit]
exclude_dirs = ["tests", "benches", "modules/*/benches", ".venv", ".git"]
skips = ["B101", "B404", "B603"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pytest-benchmark>=4.0.0",
]
