# ═══════════════════════════════════════════════════════════════════════
# lint_arwaky.config.yaml — Unified configuration for all languages
# Replaces: lint_arwaky.config.rust.yaml, lint_arwaky.config.python.yaml,
#           lint_arwaky.config.typescript.yaml, lint_arwaky.config.javascript.yaml
# ═══════════════════════════════════════════════════════════════════════

thresholds:
  score: 100.0
  complexity: 15

# ─── Adapters ─────────────────────────────────────────────────────────
# All adapters listed. The system auto-filters by detected language.
# This list is also authoritative: `scan`/`check`/`external` only run the
# adapters named here, so an adapter that is not listed is never invoked —
# CI and TEST.md §1 install exactly this set.
adapters:
  # Rust
  - name: "clippy"
    weight: 1.0
  - name: "rustfmt"
    weight: 1.0
  - name: "cargo-audit"
    weight: 1.0
  # Python
  - name: "ruff"
    weight: 1.0
  - name: "mypy"
    weight: 1.0
  - name: "bandit"
    weight: 1.0
  # TypeScript/JavaScript
  - name: "eslint"
    weight: 1.0
  - name: "tsc"
    weight: 1.0
  - name: "prettier"
    weight: 1.0
  # Markdown
  - name: "markdownlint"
    weight: 1.0
  # Internal
  - name: "architecture"
    weight: 3.0

ignored_rules:
  # Rule-level suppressions, applied to every linter's findings. Matched as a
  # case-insensitive substring of the violation code, so `MD013` silences every
  # adapter's MD013 and `AES2` silences a whole AES range.
  #
  # The markdownlint policy lives here rather than in a separate
  # `.markdownlint-cli2.jsonc`: `markdownlint-cli2` reads policy only from the
  # directory it runs in and never walks up, so a tool-specific file would have
  # to be duplicated into every scan root in the repo. Keeping it beside
  # `adapters:` makes this file the single source of truth for what runs and
  # what is reported.
  #
  # The structural rules (MD012, MD022, MD031, MD032, MD040, MD047, MD056,
  # MD058) deliberately stay enabled — they are what catches a malformed table
  # or an unlabelled code fence. Enabling markdownlint surfaced real defects
  # through them, including ten BACKLOG.md tables whose header declared 5
  # columns against 6-cell rows.
  #
  # These four are off because this repository's documentation style collides
  # with them:
  #   MD013 line-length — spec tables carry a full rule code, a path and a
  #     command on one row so each table stays scannable as a single unit.
  #   MD060 table-column-style — tables are written compact (pipes tight
  #     against the cell text), not column-aligned.
  #   MD033 inline HTML — `<Type>` is Rust/TS generic notation in prose and
  #     code spans, not markup.
  #   MD024 duplicate heading — ARCHITECTURE.md repeats Purpose/Components/
  #     Dependencies/Special Rules once per AES layer, by design, and CHANGELOG.md
  #     repeats Added/Changed/Fixed per version entry. This silences the rule
  #     outright, so a genuine duplicate heading under one parent is
  #     no longer reported; nothing in this repo currently relies on that.
  - "markdownlint::MD013"
  - "markdownlint::MD060"
  - "markdownlint::MD033"
  - "markdownlint::MD024"

ignored_paths: []

# ─── Architecture rules ─────────────────────────────────────────────────
#
# The AES business rules — layer scopes, the import dependency matrix, suffix
# policies, code-quality limits — are fixed in the tool, not configurable. They
# live in `crates/shared/src/config_system/utility_architecture_constants.rs` and
# are compiled into the binary, so every project enforces the same architecture.
#
# This section carries only what a project may change: whether a rule runs and
# which files it skips. (The embedded default in
# `crates/shared/config/lint_arwaky.config.yaml` has the same shape.)
architecture:
  enabled: true
  rules:
    # ─── AES100 ───
    AES101:
      enabled: true
      exceptions: []
    AES102:
      enabled: true
      exceptions: []
