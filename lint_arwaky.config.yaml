# lint_arwaky.config.yaml — Unified configuration for all languages

# ─── Adapters ─────────────────────────────────────────────────────────
adapters:
  # Rust
  - name: "clippy"
    weight: 1.0
  - name: "rustfmt"
    weight: 1.0
  - name: "cargo-audit"
    weight: 1.0
  # Python
  - name: "ruff"
    weight: 1.0
  - name: "mypy"
    weight: 1.0
  - name: "bandit"
    weight: 1.0
  # TypeScript
  - name: "eslint"
    weight: 1.0
  - name: "tsc"
    weight: 1.0
  - name: "prettier"
    weight: 1.0
  # Markdown
  - name: "markdownlint"
    weight: 1.0
  # Internal
  - name: "architecture"
    weight: 3.0

ignored_rules:
  - "markdownlint::MD013"
  - "markdownlint::MD060"
  - "markdownlint::MD033"
  - "markdownlint::MD024"
  
ignored_paths: []

