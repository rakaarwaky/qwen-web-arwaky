[pytest]
testpaths = modules/shared/tests,modules/cli/tests,modules/tui/tests,modules/mcp/tests,modules/prompt/tests,modules/prompt_runtime/tests,modules/session/tests,modules/jobs/tests,modules/browser/tests,modules/config/tests,modules/logging/tests,modules/swarm/tests,modules/update/tests,benches,modules/shared/benches,modules/prompt/benches,modules/prompt_runtime/benches
pythonpath = .
addopts = -q
python_files = test_*.py unit_*.py contract_*.py integration_*.py smoke_*.py e2e_*.py acceptance_*.py regression_*.py bench_*.py
markers =
    e2e: End-to-end tests requiring live network and auth session
    slow: Tests that take more than 5 seconds
    benchmark: Benchmark tests (skip with -m "not benchmark")
    uat: Acceptance-criteria sign-off scenarios for a named user persona

[tool:coverage]
run =
    source = src
    omit = tests/*
report =
    show_missing = true

