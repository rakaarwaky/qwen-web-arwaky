[pytest]
testpaths = tests,benches,modules/shared/benches,modules/core/benches
pythonpath = .
addopts = -q
python_files = test_*.py unit_*.py contract_*.py integration_*.py smoke_*.py e2e_*.py acceptance_*.py regression_*.py bench_*.py
markers =
    parallel_browser: Tests that launch real concurrent Chromium instances (require the parallel_browser_resources fixture)
    e2e: End-to-end tests requiring live network and auth session
    slow: Tests that take more than 5 seconds
    benchmark: Benchmark tests (skip with -m "not benchmark")
    uat: Acceptance-criteria sign-off scenarios for a named user persona

[tool:coverage]
run =
    source = src
    omit = tests/*
report =
    show_missing = true

